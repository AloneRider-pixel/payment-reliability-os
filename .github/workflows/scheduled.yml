name: Scheduled Operations

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      business_id:
        description: "Optional business ID; blank runs all businesses"
        required: false
        default: ""

concurrency:
  group: scheduled-operations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-scheduled-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run daily operations
        run: |
          if [ -n "${{ inputs.business_id }}" ]; then
            python scripts/run_scheduled_jobs.py --business-id "${{ inputs.business_id }}"
          else
            python scripts/run_scheduled_jobs.py
          fi
